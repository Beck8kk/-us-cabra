<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b20">
  <title>Noite Estrelada</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #080b20; color: #f5f2ff; font-family: system-ui, sans-serif; }
    body { display: grid; place-items: center; min-height: 100svh; padding: 18px; }
    main { width: min(100%, 960px); text-align: center; }
    h1 { margin: 0 0 8px; font-size: clamp(1.35rem, 4vw, 2rem); letter-spacing: .04em; }
    p { margin: 0 0 14px; color: #c6c7e4; font-size: .95rem; }
    canvas { display: block; width: 100%; aspect-ratio: 16 / 9; border: 1px solid #34365b; border-radius: 16px; background: #0b1030; box-shadow: 0 18px 60px #0008; touch-action: none; }
    .hint { margin-top: 12px; color: #aeb2d8; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Noite Estrelada</h1>
    <p>Recolha as estrelas que caem e aproveite a noite.</p>
    <canvas id="game" aria-label="Jogo: mova a lua pelo piso para recolher estrelas no céu noturno"></canvas>
    <div class="hint">← → ou A / D para mover · toque ou arraste para jogar</div>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('#game');
      const ctx = canvas.getContext('2d');
      const W = 960, H = 540, groundY = 455;
      let dpr = 1, score = 0, best = Number(localStorage.getItem('noite-estrelada-best') || 0);
      let player = { x: W / 2, y: groundY - 19, r: 19, speed: 390 };
      let stars = [], keys = new Set(), pointerX = null, last = 0, spawn = 0, elapsed = 0;
      const skyStars = Array.from({ length: 115 }, () => ({ x: Math.random() * W, y: Math.random() * (groundY - 35), r: Math.random() * 1.7 + .35, phase: Math.random() * Math.PI * 2 }));
      function resize() {
        const box = canvas.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(box.width * dpr); canvas.height = Math.round(box.height * dpr);
        ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
      }
      function starPath(x, y, outer, inner, points = 5) {
        ctx.beginPath();
        for (let i = 0; i < points * 2; i++) {
          const radius = i % 2 ? inner : outer;
          const a = i * Math.PI / points - Math.PI / 2;
          ctx.lineTo(x + Math.cos(a) * radius, y + Math.sin(a) * radius);
        }
        ctx.closePath();
      }
      function draw() {
        const sky = ctx.createLinearGradient(0, 0, 0, groundY);
        sky.addColorStop(0, '#080b20'); sky.addColorStop(.7, '#11183b'); sky.addColorStop(1, '#24234b');
        ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
        skyStars.forEach(s => {
          const glow = .45 + Math.sin(elapsed * 1.5 + s.phase) * .3;
          ctx.globalAlpha = glow; ctx.fillStyle = '#e5e8ff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = 1;
        // Horizonte suave e piso: sem cenário adicional.
        const haze = ctx.createLinearGradient(0, groundY - 30, 0, groundY + 25);
        haze.addColorStop(0, '#8576d022'); haze.addColorStop(1, '#8576d000);
        ctx.fillStyle = haze; ctx.fillRect(0, groundY - 30, W, 55);
        ctx.fillStyle = '#17172f'; ctx.fillRect(0, groundY, W, H - groundY);
        ctx.fillStyle = '#8077b8'; ctx.fillRect(0, groundY, W, 2);
        ctx.fillStyle = '#292746'; ctx.fillRect(0, groundY + 5, W, 2);
        stars.forEach(s => {
          ctx.save(); ctx.shadowColor = '#ffe78a'; ctx.shadowBlur = 18; ctx.fillStyle = '#ffe78a';
          starPath(s.x, s.y, 13, 5); ctx.fill(); ctx.restore();
        });
        // Personagem-lua.
        ctx.save(); ctx.shadowColor = '#d7e3ff'; ctx.shadowBlur = 22;
        const moon = ctx.createRadialGradient(player.x - 6, player.y - 7, 2, player.x, player.y, player.r);
        moon.addColorStop(0, '#fffde8'); moon.addColorStop(1, '#b9c9ff');
        ctx.fillStyle = moon; ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        ctx.fillStyle = '#171a3c'; ctx.beginPath(); ctx.arc(player.x + 7, player.y - 4, 15, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '600 20px system-ui'; ctx.textAlign = 'left';
        ctx.fillText(`Estrelas: ${score}`, 24, 38);
        ctx.textAlign = 'right'; ctx.fillStyle = '#c9cbe8'; ctx.font = '15px system-ui'; ctx.fillText(`Recorde: ${best}`, W - 24, 37);
      }
      function frame(now) {
        const dt = Math.min((now - last) / 1000 || 0, .04); last = now; elapsed += dt;
        if (keys.has('ArrowLeft') || keys.has('a') || keys.has('A')) player.x -= player.speed * dt;
        if (keys.has('ArrowRight') || keys.has('d') || keys.has('D')) player.x += player.speed * dt;
        if (pointerX !== null) player.x += Math.sign(pointerX - player.x) * Math.min(Math.abs(pointerX - player.x), player.speed * dt);
        player.x = Math.max(player.r + 5, Math.min(W - player.r - 5, player.x));
        spawn += dt;
        if (spawn > Math.max(.38, .95 - score * .012)) { stars.push({ x: 25 + Math.random() * (W - 50), y: -15, speed: 110 + Math.random() * 75 + score * 2 }); spawn = 0; }
        stars = stars.filter(s => {
          s.y += s.speed * dt;
          if (Math.hypot(s.x - player.x, s.y - player.y) < player.r + 12) {
            score++; if (score > best) { best = score; localStorage.setItem('noite-estrelada-best', best); }
            return false;
          }
          return s.y < H + 20;
        });
        draw(); requestAnimationFrame(frame);
      }
      window.addEventListener('keydown', e => { if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault(); keys.add(e.key); });
      window.addEventListener('keyup', e => keys.delete(e.key));
      function setPointer(e) { const r = canvas.getBoundingClientRect(); pointerX = (e.clientX - r.left) / r.width * W; }
      canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); setPointer(e); });
      canvas.addEventListener('pointermove', e => { if (e.buttons) setPointer(e); });
      canvas.addEventListener('pointerup', () => { pointerX = null; });
      window.addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
