<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8bbce7">
  <title>Horizonte — ambiente 3D</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17314b;
      background: #dcebf7;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { min-height: 100svh; }
    #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
    .panel {
      position: fixed;
      z-index: 1;
      top: clamp(18px, 4vw, 42px);
      left: clamp(18px, 4vw, 48px);
      pointer-events: none;
      animation: arrive .8s ease-out both;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 10px;
      color: #355a79;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .19em;
      text-transform: uppercase;
    }
    .eyebrow::before { width: 21px; height: 1px; background: #5785a9; content: ""; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 54px); font-weight: 500; letter-spacing: -.055em; line-height: 1; }
    .subtitle { margin: 12px 0 0; color: #385b78; font-size: clamp(13px, 1.5vw, 15px); letter-spacing: .01em; }
    .controls {
      position: fixed;
      z-index: 1;
      right: clamp(18px, 4vw, 48px);
      bottom: clamp(18px, 4vw, 38px);
      display: flex;
      align-items: center;
      gap: 15px;
      color: #294d6b;
      font-size: 12px;
      animation: arrive .8s .15s ease-out both;
    }
    .hint { padding: 11px 15px; border: 1px solid #ffffff99; border-radius: 999px; background: #f5faff70; backdrop-filter: blur(12px); }
    button {
      width: 39px;
      height: 39px;
      border: 1px solid #ffffffa8;
      border-radius: 50%;
      background: #f5faff85;
      color: #294d6b;
      font: inherit;
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: background .2s, transform .2s;
    }
    button:hover { transform: rotate(-35deg); background: #fff; }
    button:focus-visible { outline: 2px solid #294d6b; outline-offset: 3px; }
    .error { position: fixed; inset: auto 20px 20px; z-index: 2; display: none; padding: 12px 16px; border-radius: 12px; background: #fff; color: #17314b; font-size: 14px; text-align: center; }
    @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 520px) {
      .subtitle { max-width: 230px; line-height: 1.5; }
      .controls { left: 18px; right: 18px; justify-content: space-between; }
      .hint { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="Ambiente 3D com piso branco infinito e céu azul"></canvas>
  <header class="panel">
    <p class="eyebrow">Um espaço aberto</p>
    <h1>Horizonte</h1>
    <p class="subtitle">Piso branco, céu azul e todo o espaço para respirar.</p>
  </header>
  <div class="controls">
    <span class="hint">Arraste para olhar · role para aproximar</span>
    <button id="reset" type="button" aria-label="Restaurar a vista inicial" title="Restaurar vista">⟳</button>
  </div>
  <div id="error" class="error" role="status">Não foi possível carregar a cena 3D. Verifique sua conexão e atualize a página.</div>

  <script type="module">
    import * as THREE from 'three';

    const canvas = document.querySelector('#scene');
    const errorMessage = document.querySelector('#error');
    try {
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;

      const scene = new THREE.Scene();
      const horizonColor = new THREE.Color('#dce9f2');
      scene.fog = new THREE.Fog(horizonColor, 90, 720);

      // A esfera envolve a câmera e pinta o céu em degradê, sem linha ou textura repetida.
      const skyGeometry = new THREE.SphereGeometry(5000, 32, 20);
      const skyMaterial = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: { sunDirection: { value: new THREE.Vector3(-0.45, 0.62, -0.64).normalize() } },
        vertexShader: `
          varying vec3 vDirection;
          void main() {
            vDirection = normalize(position);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vDirection;
          uniform vec3 sunDirection;
          void main() {
            vec3 direction = normalize(vDirection);
            float height = max(direction.y, 0.0);
            vec3 horizon = vec3(0.82, 0.89, 0.94);
            vec3 middle = vec3(0.48, 0.69, 0.88);
            vec3 zenith = vec3(0.20, 0.43, 0.68);
            vec3 sky = mix(horizon, middle, smoothstep(0.0, 0.38, height));
            sky = mix(sky, zenith, smoothstep(0.25, 1.0, height) * 0.82);
            float sun = dot(direction, normalize(sunDirection));
            float glow = pow(max(sun, 0.0), 24.0) * 0.16;
            float disc = smoothstep(0.9990, 0.99965, sun);
            sky = mix(sky, vec3(1.0, 0.96, 0.84), clamp(glow + disc, 0.0, 1.0));
            gl_FragColor = vec4(sky, 1.0);
          }
        `
      });
      const sky = new THREE.Mesh(skyGeometry, skyMaterial);
      sky.renderOrder = -1;
      scene.add(sky);

      // Plano muito extenso e neblina suave fazem o piso branco desaparecer no horizonte.
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(20000, 20000),
        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.92, metalness: 0 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.02;
      scene.add(floor);

      scene.add(new THREE.HemisphereLight(0xe9f5ff, 0xd8e0e5, 2.05));
      const sunlight = new THREE.DirectionalLight(0xfff4df, 2.1);
      sunlight.position.set(-80, 110, -120);
      scene.add(sunlight);

      const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.1, 10000);
      const initial = { theta: 0, phi: 1.28, radius: 12 };
      const target = new THREE.Vector3(0, 1.35, 0);
      let theta = initial.theta;
      let phi = initial.phi;
      let radius = initial.radius;
      let dragging = false;
      let previousX = 0;
      let previousY = 0;

      function updateCamera() {
        const sinPhi = Math.sin(phi);
        camera.position.set(
          target.x + radius * sinPhi * Math.sin(theta),
          target.y + radius * Math.cos(phi),
          target.z + radius * sinPhi * Math.cos(theta)
        );
        camera.lookAt(target);
      }
      updateCamera();

      canvas.addEventListener('pointerdown', event => {
        dragging = true;
        previousX = event.clientX;
        previousY = event.clientY;
        canvas.setPointerCapture(event.pointerId);
        canvas.style.cursor = 'grabbing';
      });
      canvas.addEventListener('pointermove', event => {
        if (!dragging) return;
        theta -= (event.clientX - previousX) * 0.004;
        phi = THREE.MathUtils.clamp(phi + (event.clientY - previousY) * 0.004, 0.16, Math.PI / 2 - 0.025);
        previousX = event.clientX;
        previousY = event.clientY;
        updateCamera();
      });
      function stopDragging() { dragging = false; canvas.style.cursor = 'grab'; }
      canvas.addEventListener('pointerup', stopDragging);
      canvas.addEventListener('pointercancel', stopDragging);
      canvas.addEventListener('wheel', event => {
        event.preventDefault();
        radius = THREE.MathUtils.clamp(radius * (1 + event.deltaY * 0.001), 4, 38);
        updateCamera();
      }, { passive: false });
      canvas.style.cursor = 'grab';

      document.querySelector('#reset').addEventListener('click', () => {
        theta = initial.theta;
        phi = initial.phi;
        radius = initial.radius;
        updateCamera();
      });

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(width, height);
      }
      window.addEventListener('resize', resize);

      renderer.setAnimationLoop(() => renderer.render(scene, camera));
    } catch (error) {
      console.error('Falha ao iniciar o ambiente 3D:', error);
      errorMessage.style.display = 'block';
    }
  </script>
</body>
</html>
